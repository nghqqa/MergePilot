# MergePilot 官网 — 二级域名 Nginx 静态站配置
# 部署路径：/var/www/<domain>
# 域名：<待填>.nghqqa.cn（DNS A 记录→你的服务器 IP）
# 证书：Let's Encrypt（certbot --nginx 自动获取+续期）
#
# 使用方式：将本文件复制到 /etc/nginx/sites-available/<domain>，
# ln -s /etc/nginx/sites-available/<domain> /etc/nginx/sites-enabled/
# 先运行 nginx -t 确认无语法错误，再 systemctl reload nginx。
#
# 安全：禁止目录浏览/隐藏文件/仓库元数据；HTML 短缓存；指纹资源长期缓存。

# ── HTTP → HTTPS 301 ──
server {
    listen 80;
    server_name <domain>.nghqqa.cn;
    return 301 https://$host$request_uri;
}

# ── HTTPS 主站 ──
server {
    listen 443 ssl http2;
    server_name <domain>.nghqqa.cn;

    # TLS 证书（certbot --nginx 自动填入，或手动指定路径）
    # ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;

    # 网站根目录（版本目录部署 + current symlink）
    root /var/www/<domain>/current;
    index index.html;

    # ── 安全头 ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── 隐藏文件与仓库元数据 ──
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~ \.(git|svn|hg) { deny all; return 404; }
    location ~ /(\.env|\.gitignore|CHANGELOG) { deny all; return 404; }

    # ── 禁止目录浏览 ──
    autoindex off;

    # ── 缓存策略 ──
    # HTML：不缓存（确保更新即时可见）
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }
    # 带内容指纹的 assets：长期 immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── 限流（连接级）──
    limit_conn conn_per_ip 20;
    limit_req zone=req_per_ip burst=30 nodelay;

    # ── 压缩 ──
    gzip on;
    gzip_types text/html text/css application/json image/svg+xml;
    gzip_min_length 256;

    # ── 错误页 ──
    error_page 404 /index.html;

    # ── charset ──
    charset utf-8;
}

# ── 限流 zone（放 http 块或 conf.d/limits.conf）──
# limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
# limit_req_zone  $binary_remote_addr zone=req_per_ip:10m rate=30r/s;
