# policy.yaml — MergePilot M3-B 最小权限矩阵(deny-by-default)。
# 版本进 git,不热改表;gateway 启动时计算 policy_hash = sha256(文件内容)写入每条审计。
# 任何上游新增工具只要不在此文件显式 allow,对所有角色默认不可见、不可调。
#
# 工具分级:
#   read    — 只读(reviewer/verifier/fixer/coordinator 都可用;带 owner+repo 的统一受 repo allowlist 约束)
#   comment — 轻量写:评论/review 请求(fixer/coordinator 可用)
#   fix     — 修复写:建分支/改文件/建 PR(仅 fixer,受 write_checks 约束)
#   l2      — 破坏性/不可逆:merge/delete(仅 coordinator,需审批票据)
#   disabled — 上游存在但所有角色都不可见(无业务用例/数据扩散/未绑定 run_id)
#
# update_pull_request 是混合风险工具,不归入任何类;通过 extra_tools 单独授权 +
# 参数级规则(fixer 仅 title/body;state→L2;其他字段→PR_FIELD_NOT_ALLOWED)。
version: "b2.2-20260726-v1"

# ─── 全局约束 ───
repos:
  allowlist:
    - "nghqqa/MergePilot"
branches:
  base_allowlist: ["main"]
  fix_prefix: "fix/"
  protected: ["main"]
file_paths:
  denylist:
    - "glob:**/.env*"
    - "glob:**/*.pem"
    - "glob:**/*.key"
    - "glob:**/secrets/**"
    - "glob:**/.github/workflows/**"
    - "glob:**/credentials*"

# ─── 工具分类(44 个上游工具)───
tool_classes:
  read:
    - get_me
    - get_commit
    - get_file_contents
    - get_label
    - get_latest_release
    - get_release_by_tag
    - get_tag
    - list_branches
    - list_commits
    - list_issues
    - list_pull_requests
    - list_releases
    - list_repository_collaborators
    - list_tags
    # search_scoped:允许但 query 必须纯术语(无限定符/布尔算子),
    # gateway 自己注入 repo:<allowlist>(不信任调用者 scope)
    - search_code
    - search_commits
    - search_issues
    - search_pull_requests
    - issue_read
    - pull_request_read
  comment:
    - add_comment_to_pending_review
    - add_issue_comment
    - add_reply_to_pull_request_comment
    - request_copilot_review
    - pull_request_review_write
  fix:
    - create_branch
    - create_or_update_file
    - push_files
    - create_pull_request
  l2:
    - merge_pull_request
    - delete_file
  disabled:
    # 无业务用例 / 数据扩散风险 / 启动外部 Agent / 未绑定 run_id —— 所有角色不可见
    - create_repository
    - fork_repository
    - search_repositories
    - search_users
    - assign_copilot_to_issue
    # B2.2:fixer 残留写工具,当前修复流程不用且未绑 run_id/PR → 禁用
    - issue_write
    - sub_issue_write
    - update_pull_request_branch   # B4 以 PR+head SHA 绑定后可重新开放
    # B2.2:reviewer 组织级读 / 可省略 repo 的元数据读,当前流程不需要 → 禁用
    - get_teams
    - get_team_members
    - list_issue_fields
    - list_issue_types

# ─── 角色 → 允许的工具类 + 额外工具 + 约束 ───
roles:
  reviewer:
    classes: [read]
  verifier:
    classes: [read]
  fixer:
    classes: [read, comment, fix]
    extra_tools: [update_pull_request]   # 仅 title/body(state→L2,其他字段拒)
    write_checks: true
  coordinator:
    classes: [read, comment, l2]
    extra_tools: [update_pull_request]   # 仅 state(L2,需票据);其他字段拒
    l2_requires_ticket: true
