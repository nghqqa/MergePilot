# PRODUCTION_RAG_READINESS 隔离评估栈（rag-prod-eval）。
#
# 隔离合同：与 promote3/promote2/local-rag-trial/rag-integration 等所有栈零共享——
# 独立 project/网络/卷/端口段（sidecar 48471 / console 48470 / pg 15438 / minio 9115，
# 全部 127.0.0.1）。绝不切换 canonical promote3；C 链 enforcement 保持 off；
# 凭据为 .env 一次性本地值（gitignored）。
#
# 真实语义模型链路：console → bge-sidecar（构建期锁定 numpy/scipy/tokenizers 版本；
# 模型权重只读 bind mount 自主机 HF 缓存快照，启动即按 manifest sha256 fail-closed
# 校验，绝无运行时下载）→ chunks_semantic vector(1024)。
name: rag-prod-eval

services:
  bge-sidecar:
    image: rag-prod-bge-sidecar:local
    pull_policy: never
    build:
      context: ../..
      dockerfile: deploy/rag-prod/bge-sidecar/Dockerfile
    environment:
      # 快照内是相对符号链接（../../blobs）——必须挂整个仓库目录，链接才能解析
      BGE_MODEL_DIR: /app/hf-model/snapshots/d4aa6901d3a41ba39fb536a557fa166f842b0e09
    volumes:
      # 只读挂载主机 HF 缓存模型仓库（公共模型工件，非凭据）；路径经 .env 注入
      - type: bind
        read_only: true
        source: ${RAGPROD_BGE_HUB_DIR:-C:/Users/ngh/.cache/huggingface/hub/models--BAAI--bge-large-en-v1.5}
        target: /app/hf-model
    ports: ["127.0.0.1:${RAGPROD_SIDECAR_PORT:-48471}:8080"]
    networks: [rag-prod-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  pg:
    image: pgvector/pgvector:pg16
    pull_policy: never
    environment:
      POSTGRES_PASSWORD: "${RAGPROD_PG_PASSWORD}"
      POSTGRES_DB: ragprod
    volumes: [ragprod-pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragprod"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [rag-prod-net]
    ports: ["127.0.0.1:${RAGPROD_PG_PORT:-15438}:5432"]

  minio:
    image: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    pull_policy: never
    command: server /data
    environment:
      MINIO_ROOT_USER: "${RAGPROD_MINIO_USER}"
      MINIO_ROOT_PASSWORD: "${RAGPROD_MINIO_PASSWORD}"
    volumes: [ragprod-miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [rag-prod-net]
    ports: ["127.0.0.1:${RAGPROD_MINIO_PORT:-9115}:9000"]

  console:
    image: rag-prod-console:local
    pull_policy: never
    build:
      context: ../..
      dockerfile: docker/Dockerfile.canonical-console
    restart: unless-stopped
    depends_on:
      pg: { condition: service_healthy }
      minio: { condition: service_healthy }
      bge-sidecar: { condition: service_healthy }
    environment:
      CONSOLE_PG_DSN: "postgres://postgres:${RAGPROD_PG_PASSWORD}@pg:5432/ragprod"
      CONSOLE_HOST: "0.0.0.0"
      CONSOLE_PILOT_USER: "${RAGPROD_CONSOLE_USER}"
      CONSOLE_PILOT_PASSWORD: "${RAGPROD_CONSOLE_PASSWORD}"
      CONSOLE_SESSION_SECRET: "${RAGPROD_SESSION_SECRET}"
      RAGTRIAL_S3_ENDPOINT: "http://minio:9000"
      RAGTRIAL_S3_BUCKET: "ragprod"
      RAGTRIAL_S3_ACCESS_KEY: "${RAGPROD_MINIO_USER}"
      RAGTRIAL_S3_SECRET_KEY: "${RAGPROD_MINIO_PASSWORD}"
      RAGTRIAL_CORPUS_DIR: "/app/rag-corpus"
      # 真实语义 provider（attested）：manifest sha256 fail-closed 钉死
      RAGTRIAL_EMBED_ENDPOINT: "http://bge-sidecar:8080/embed"
      RAGTRIAL_EMBED_MODEL_ID: "bge-large-en-v1.5"
      RAGTRIAL_EMBED_DIMS: "1024"
      RAGTRIAL_EMBED_TIMEOUT_MS: "30000"
      RAGTRIAL_EMBED_EXPECTED_MANIFEST: "${RAGPROD_EXPECTED_MANIFEST}"
      # 机器通道 keystore（合成测试密钥，由 scripts/bootstrap-keystore.mjs 生成，绝不提交）
      MERGEPILOT_RUN_BINDING_KEYSTORE: "/app/keystore"
      # scope allowlist（默认拒绝；缺配置=全拒。评估栈放行基准 scope）
      RAGTRIAL_ALLOWED_SCOPES: "${RAGPROD_ALLOWED_SCOPES:-nghqqa/mergepilot@feat/rag-prod-readiness}"
    volumes:
      - ./corpus:/app/rag-corpus:ro
      - ./keystore-local:/app/keystore:ro
      - ragprod-evidence:/app/evidence
    ports: ["127.0.0.1:${RAGPROD_CONSOLE_PORT:-48470}:4730"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=5", "http://127.0.0.1:4730/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [rag-prod-net]

volumes:
  ragprod-pgdata: {}
  ragprod-miniodata: {}
  ragprod-evidence: {}

networks:
  rag-prod-net: {}
