name: console-backend

# 后端/前端全量门禁（2026-09-27 生产候选轮补齐——此前仅 secret-scan+selftest，
# console 后端测试无 CI 自动化，为评审登记缺口）。
# 覆盖：后端单测/合同全量（node --test test/*.test.mjs）、FXV PG 集成（18 场景）、
# FXV e2e 归档（15 场景，真 git+PG+MinIO）、C 链 PG 审计集成、前端构建。
#
# env-skip 登记（不删除、不降低门禁）：
#  * live-v3.integration.test.mjs —— 需 legacy 4191 contract-fixture harness
#    （console/frontend/dev/contract-fixture-harness.mjs，历史 console_v3 轮产物，
#    本仓库 CI 未携带该 harness 的启动约定），保持 MERGEPILOT_V3_URL 未设即跳过。
#  * 其余 *.test.mjs 中 10 项 env-skip 与本地口径一致（集成依赖按上述单独步骤起服务）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console-backend:
    name: console backend + frontend gate
    runs-on: ubuntu-latest
    # 溯源轮加固：合理超时（全套实测 ~1.5min，留 10x 余量）+ 并发去重（同 ref 只保留最新运行）
    timeout-minutes: 15
    concurrency:
      group: console-backend-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-password-pg-ci
          POSTGRES_DB: fxv
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      FXV_PG_TEST_DSN: postgres://postgres:test-password-pg-ci@127.0.0.1:5432/fxv
      CCHAIN_TEST_DSN: postgres://postgres:test-password-pg-ci@127.0.0.1:5432/fxv
      FXV_S3_ENDPOINT: http://127.0.0.1:9000
      FXV_S3_ACCESS_KEY: ci-minio
      FXV_S3_SECRET_KEY: ci-minio-secret-123456
      FXV_S3_BUCKET: fxv-artifacts-e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # MinIO（digest pin：与受控 staging 验证同源镜像；curl 健康检查已实证）
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci-minio-secret-123456 \
            elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd \
            server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null

      - name: Install backend test deps (dev-only pg)
        run: npm ci --no-audit --no-fund
        working-directory: console/backend/test/support

      - name: Backend unit + contract suites (env-skips preserved, reasons in header)
        run: node --test console/backend/test/*.test.mjs

      # 生产依赖就绪 fail-closed（HARDENING 波接入）：17 场景（SM-1~9 keystore + EA-1~8 attestation）
      # 全部合成 fixture——零真实凭据、零真实端点、NOT_CONFIGURED/BLOCKED 不得 skip 隐藏。
      - name: "Dependency readiness fail-closed (17 scenarios: SM-1~9 + EA-1~8)"
        run: node --test console/backend/test/ragtrial-dependency-readiness.test.mjs

      - name: FXV PG integration (18 scenarios)
        run: node --test console/backend/test/fxv-pg.integration.mjs

      - name: C-chain PG audit integration
        run: node --test console/backend/test/cchain-wiring.integration.mjs

      - name: FXV e2e archive (15 scenarios, real git+PG+MinIO)
        run: node console/backend/test/fxv-e2e-archive.integration.mjs

      # MU Developer Edition 多用户（自起一次性 postgres:16-alpine 容器，随机回环端口）
      - name: MU store schema integration (Phase 1, 16 scenarios)
        run: node console/backend/test/mu-store.integration.mjs

      - name: MU RBAC + tenant isolation integration (Phase 2/3, 59 scenarios)
        run: node console/backend/test/mu-rbac.integration.mjs

      # RAG canonical 集成（Phase 0a F-6 补账）：自起一次性 pgvector 容器、随机回环
      # 端口、finally 强制清理——不连接/复用任何常驻栈；跑在既有 job 内，required
      # check 名称不变（main 保护零影响）
      - name: RAG canonical integration (Phase 0a, 34 scenarios; self-boot pgvector)
        run: node console/backend/test/ragtrial-canonical.integration.mjs

      # Beta Identity Wave 2A：OAuth 登录/持久会话/邀请（GitHub 全部走本地 mock adapter）
      - name: MU OAuth + persistent session integration (Wave 2A, 29 scenarios)
        run: node console/backend/test/mu-oauth.integration.mjs

      # Wave 2B：GitHub App 只读安装/绑定/webhook 验签（mock adapter，合成密钥）
      - name: MU GitHub App binding + webhook integration (Wave 2B, 34 scenarios)
        run: node console/backend/test/mu-ghapp.integration.mjs

      # Wave 3.1-3.4：LLM provider/策略控制面/AgentTeams adapter/Matrix transport（mock 零网络）
      - name: MU LLM provider integration (Wave 3.1, 34 scenarios)
        run: node console/backend/test/mu-llm-w31.integration.mjs
      - name: MU agent policy integration (Wave 3.2, 30 scenarios)
        run: node console/backend/test/mu-policy-w32.integration.mjs
      - name: MU AgentTeams executor integration (Wave 3.3, 48 scenarios)
        run: node console/backend/test/mu-agentteams-w33.integration.mjs
      - name: MU Matrix transport integration (Wave 3.4, 39 scenarios)
        run: node console/backend/test/mu-matrix-w34.integration.mjs

      # Wave 3.7 数据源纯化门槛：fxv 漂移调和七场景 + legacy 哨兵 + zero-legacy-query
      # （MU_QUERY_TRACE 采集、请求窗口切片）+ data_source 契约 + pulls/:n 编号寻址
      - name: MU data-source purification gate (Wave 3.7, 34 scenarios; self-boot postgres)
        run: node console/backend/test/mu-purify-w37.integration.mjs

      # Wave 3.8 队首阻塞（HOL）回归门槛：过期人工 job 不阻塞跨租户 event_sync、
      # 孤立 lease 回收、过期清收终态+审计、乱序/重复 delivery 幂等、状态不变量
      - name: MU queue HOL regression gate (Wave 3.8, 32 scenarios; self-boot postgres)
        run: node console/backend/test/mu-queue-hol-w38.integration.mjs

      # Wave 3.9 Beta 硬化：schema 初始化启动显式执行（readiness gate）——
      # fresh DB 零业务请求即就绪、facade 独立 pool 不再绕过、重复启动幂等
      - name: MU eager schema init gate (Wave 3.9, 5 scenarios; self-boot postgres)
        run: node console/backend/test/mu-eager-init.integration.mjs

      # ADR-002 审查架构 v2（external-api 链，mock Provider 零真实网络）：
      # PR A 控制面 + PR B 上下文 + PR C Reviewer + PR D Fixer + PR E Verifier + PR F 披露面
      - name: MU review-arch v2 control plane (PR A, 33 scenarios)
        run: node console/backend/test/mu-review-arch-v2.integration.mjs
      - name: MU context builder integration (PR B, 15 scenarios)
        run: node console/backend/test/mu-context-builder.integration.mjs
      - name: MU external reviewer integration (PR C, 14 scenarios)
        run: node console/backend/test/mu-external-reviewer.integration.mjs
      - name: MU fixer sandbox integration (PR D, 16 scenarios)
        run: node console/backend/test/mu-fixer-sandbox.integration.mjs
      - name: MU verifier tools integration (PR E, 22 scenarios)
        run: node console/backend/test/mu-verifier-tools.integration.mjs
      - name: MU review-arch disclosure API (PR F, 12 scenarios)
        run: node console/backend/test/mu-review-arch-prf.integration.mjs
      - name: MU review-arch compat/security/recovery (PR G, 14 scenarios)
        run: node console/backend/test/mu-review-arch-prg.integration.mjs
      - name: MU migration upgrade v16->v17 + restart idempotency (25 scenarios)
        run: node console/backend/test/mu-migration-upgrade.integration.mjs

      # v16 高危修复审批门（fix/high-risk-fix-approval-gate）：P0/P1 逐条具名审批票+
      # WAITING 状态+唯一调度硬门（两 Fixer 入口）+过期/STALE/篡改/并发消费/RBAC/审计
      - name: MU fix-approval gate integration (v16, 52 scenarios)
        run: node console/backend/test/mu-fix-approval.integration.mjs

      # v17 技能版本治理面（feat/skill-governance）：/api/mu/skills 全矩阵——
      # 版本不可变/激活回滚状态机/并发单赢家/幂等/RBAC/CSRF/跨租户/审计脱敏
      - name: MU skill governance integration (v17, 45 scenarios)
        run: node console/backend/test/mu-skill-governance.integration.mjs

      # 技能铺底脚本（scripts/seed-skills.mjs）：6 技能×双租户+重跑幂等+指纹钉死
      - name: MU skill seed idempotency (9 scenarios)
        run: node console/backend/test/mu-skill-seed.integration.mjs

      # RAG-model-install PR1：v19 store+状态机（manifest 真源/落库幂等/CAS 并发单赢家/
      # 激活回退 provider 切换/进度心跳门）
      - name: MU rag model install store (v19, 19 scenarios)
        run: node console/backend/test/mu-rag-model-install-store.integration.mjs

      # RAG-model-install PR2：下载引擎+安装 API（本地伪官方源真 HTTP：续传/幂等/
      # 哈希 fail-closed/缺失/并发单赢家/RBAC/CSRF/审计脱敏）
      - name: MU rag model download engine (20 scenarios)
        run: node console/backend/test/mu-rag-model-download.integration.mjs

      # RAG-model-install PR3：激活/回退（伪 sidecar 三重门：health/manifest 字节 pin/embed
      # 维度冒烟；READY 门槛/失败态/并发单赢家/RBAC/CSRF/审计脱敏/零回归）
      - name: MU rag model activation (21 scenarios)
        run: node console/backend/test/mu-rag-model-activate.integration.mjs

      # RAG-model-install PR4：安装面板冒烟（四态+只读+manifest 披露+确认语义）
      - name: Frontend rag model panel smoke (3 scenarios)
        run: node --test test/rag-model-panel.smoke.test.mjs
        working-directory: console/frontend

      # RAG-model-install PR5：波级收尾（磁盘 fail-closed/仓库锚点子进程验证/DB CHECK 兜底/C 波兼容零伪造）
      - name: MU rag model wave closeout (7 scenarios)
        run: node console/backend/test/mu-rag-model-wave.integration.mjs

      - name: Frontend build
        run: |
          npm ci --no-audit --no-fund
          npm run build
        working-directory: console/frontend

      # /core 页面加载冒烟（P1 修复波）：esbuild 打包 + react-test-renderer 渲染，
      # mock fetch 全端点——锁"页面不因加载异常进入错误态"（回归：fxv ReferenceError）
      - name: Frontend /core smoke (react-test-renderer, no browser)
        run: node --test test/core-page.smoke.test.mjs
        working-directory: console/frontend

      # 运营总览 PR 链接回归（2026-10-02）：MU 形状 pr 字段 → /pr/N 绝不 /pr/undefined；
      # legacy pr_number 照常；缺值行纯文本（用户报告死链修复锁）
      - name: Frontend overview PR-link smoke (MU pr field, 2 scenarios)
        run: node --test test/overview-link.smoke.test.mjs
        working-directory: console/frontend

      # 页面渲染冒烟（P2 修复波）：PrDetail(console-pg)/C 链/RAG/Core-FXV 走完整
      # App+MemoryRouter 集成渲染——锁 status-map 中文标签真实上屏
      - name: Frontend pages smoke (PrDetail/CChain/RAG/Core-FXV)
        run: node --test test/pages-smoke.test.mjs
        working-directory: console/frontend

      # 多用户页冒烟（MU Phase 4）：权限态/成员/绑定上屏 + 未启用诚实提示
      - name: Frontend multi-user page smoke
        run: node --test test/mu-page.smoke.test.mjs
        working-directory: console/frontend

      # 多用户 OAuth 登录盒冒烟（Wave 2A）：无会话态 mu_login_error 人话映射 +
      # 联系管理员/数字 user id 指引上屏（审计 G-1：not_invited 提示此前不可达，
      # 2026-10-03 修复后纳入显式门禁防回归）
      - name: Frontend mu-oauth login-box smoke (Wave 2A, 2 scenarios)
        run: node --test test/mu-oauth-page.smoke.test.mjs
        working-directory: console/frontend

      # ADR-002 PR F 前端冒烟：审查架构面板（三档/consent 门/出站披露）+
      # PR 详情四分立判定上屏（互不冒充）
      - name: Frontend review-arch smoke (PR F, 3 scenarios)
        run: node --test test/mu-review-arch.smoke.test.mjs
        working-directory: console/frontend

      # B 波技能治理页冒烟（v17）：管理员列表+只读角色+诚实空态/错误态+
      # 与 RAG 试用区分声明+零 fixture 演练数据
      - name: Frontend skill page smoke (B wave, 3 scenarios)
        run: node --test test/skill-page.smoke.test.mjs
        working-directory: console/frontend

      # 前端 UX 修复回归（8 场景；含 PipelinePanel 四 Agent 执行表断言）
      - name: Frontend ux-fixes smoke (8 scenarios)
        run: node --test test/ux-fixes.smoke.test.mjs
        working-directory: console/frontend

      # Wave 3.7 前端静态契约：fetch URL 全落批准集合 + multiuser 源纯 /api/mu/* +
      # 零 serviceWorker/localStorage/Cache API + 构建产物单 bundle
      - name: Frontend route-to-API contract (Wave 3.7, 4 scenarios)
        run: node --test test/route-api-contract.test.mjs
        working-directory: console/frontend
