name: secret-scan
# 2026-09-26 事故收口引入：任何真实凭据命中 → CI 失败 → 阻断发布链路。
# 本地拦截由 scripts/install-hooks.sh 提供（pre-commit/pre-push）。
on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan working tree
        run: bash scripts/secret-scan.sh --path .
      - name: Scan pushed commits
        if: github.event_name == 'push'
        run: |
          BASE="${{ github.event.before }}"
          if ! git rev-parse --verify -q "$BASE" >/dev/null; then BASE=$(git rev-list --max-parents=0 HEAD | head -1); fi
          for c in $(git rev-list "$BASE..HEAD"); do
            bash scripts/secret-scan.sh --head "$c"
          done
