# M5-0B OFFLINE Gateway policy fixture (released M5-0B delivery surface).
# repos.allowlist=["example/project"] is an OFFLINE placeholder used by M5-0B
# regression; do NOT change it to nghqqa/MergePilot-e2e-fixture (would break
# M5-0B manifest exact-equality and released regression).
# Role structure (m5coordinator/fixer/reviewer/verifier) is shared with M5-0C.
# The M5-0C REAL-GitHub policy (allowlist=nghqqa/MergePilot-e2e-fixture) is the
# INDEPENDENT template at config/m5-0c-real-github-policy.yaml (v2.7 §26.4),
# validated by tests/m5_0c/test_m5_0c_policy.py.
# This file does not contain credentials; tokens are injected via env at deploy.
version: "m5-0-candidate-live-v1"

repos:
  allowlist:
    - "example/project"

branches:
  base_allowlist: ["main"]
  fix_prefix: "fix/"
  protected: ["main"]

file_paths:
  denylist:
    - "glob:**/.env*"
    - "glob:**/*.pem"
    - "glob:**/*.key"
    - "glob:**/secrets/**"
    - "glob:**/.github/workflows/**"

tool_classes:
  read:
    - pull_request_read
    - list_branches
    - list_pull_requests
    - get_file_contents
    - get_commit
    - list_commits
  comment: []
  fix:
    - create_branch
    - push_files
    - create_pull_request
  l2: []
  disabled: []

roles:
  # Production coordinator identity (unchanged, for backward-compat testing).
  coordinator:
    classes: [read]
  # v2.4 勘误:M5-0 Candidate 专用独立身份。最小权限:仅 read 类
  # (pull_request_read / get_pr_diff / get_pr_files 等只读工具)。
  # 不持 GitHub PAT,不复用生产 coordinator token;Gateway 侧由
  # ROLE_TOKENS 映射独立 m5coordinator token → 此 role。
  m5coordinator:
    classes: [read]
  reviewer:
    classes: [read]
  verifier:
    classes: [read]
  fixer:
    classes: [read, fix]
    write_checks: true
