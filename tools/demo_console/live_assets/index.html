<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MergePilot · Demo Console (ISOLATED_LIVE)</title>
<style>
/* ── Design tokens ────────────────────────────────────────────────────── */
:root {
  --bg: #0b1220; --bg-panel: #101a2c; --bg-raised: #142138;
  --border: #24344d; --border-strong: #33455f;
  --text: #dbe4f0; --text-dim: #8fa2bb; --text-faint: #64748b;
  --accent: #3b82f6; --accent-soft: #1d3a63;
  --ok: #34d399; --ok-dim: #0c3a2a;
  --warn: #fbbf24; --warn-dim: #3d2f08;
  --err: #f87171; --err-dim: #3f1414;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  --sans: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 4px; --radius-lg: 6px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; max-width: 100%; overflow-x: hidden; }
body {
  font: 14px/1.55 var(--sans); color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
code, .mono { font-family: var(--mono); font-size: 12.5px; }
h1, h2, h3 { margin: 0 0 var(--sp-3); line-height: 1.3; font-weight: 600; }
h2 { font-size: 17px; } h3 { font-size: 13.5px; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: .06em; }

/* ── Topbar ───────────────────────────────────────────────────────────── */
.topbar {
  display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center;
  justify-content: space-between;
  padding: var(--sp-3) var(--sp-5);
  background: var(--bg-panel); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: center; gap: var(--sp-3);
  font-weight: 700; font-size: 15px; letter-spacing: .01em; }
.mode-banner {
  font: 600 11px/1 var(--sans); letter-spacing: .08em;
  color: #eaf2ff; background: var(--accent);
  padding: 5px 9px; border-radius: var(--radius);
}
.topbar-status { display: flex; align-items: center; gap: var(--sp-3);
  flex-wrap: wrap; min-width: 0; }

/* ── Live banner (engine-managed) ─────────────────────────────────────── */
#live-banner {
  display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
  font: 12px/1.4 var(--mono); color: var(--text-dim);
  background: var(--bg-raised); border: 1px solid var(--border);
  padding: 6px 10px; border-radius: var(--radius); min-width: 0;
  max-width: 100%; overflow-wrap: anywhere;
}
#live-banner .chip { flex: 0 0 auto; }
#live-banner[data-state="OK"] .chip { background: var(--ok-dim); color: var(--ok); }
#live-banner[data-state="LOADING"] .chip { background: var(--accent-soft); color: #9ec3ff; }
#live-banner[data-state="STALE"] .chip,
#live-banner[data-state="HTTP_ERROR"] .chip,
#live-banner[data-state="JSON_ERROR"] .chip,
#live-banner[data-state="NO_SNAPSHOT"] .chip { background: var(--err-dim); color: var(--err); }
#live-banner[data-state="STALE"], #live-banner[data-state="HTTP_ERROR"],
#live-banner[data-state="JSON_ERROR"], #live-banner[data-state="NO_SNAPSHOT"] { color: var(--err); }
.chip {
  font: 600 10.5px/1 var(--sans); letter-spacing: .07em;
  padding: 4px 7px; border-radius: var(--radius);
  background: var(--bg-panel); color: var(--text-dim);
  border: 1px solid var(--border-strong);
}
#live-refresh-btn {
  font: 600 12px/1 var(--sans); color: var(--text);
  background: var(--bg-raised); border: 1px solid var(--border-strong);
  padding: 7px 12px; border-radius: var(--radius); cursor: pointer;
}
#live-refresh-btn:hover:not(:disabled) { border-color: var(--accent);
  color: #fff; }
#live-refresh-btn:disabled { opacity: .55; cursor: progress; }

/* ── Shell: side nav + content ────────────────────────────────────────── */
.shell { display: grid; grid-template-columns: 208px minmax(0, 1fr);
  gap: 0; min-height: calc(100vh - 58px); }
.sidenav {
  border-right: 1px solid var(--border); background: var(--bg-panel);
  padding: var(--sp-3) var(--sp-2); display: flex; flex-direction: column;
  gap: 2px; position: sticky; top: 58px; align-self: start;
}
.nav-btn {
  display: block; width: 100%; text-align: left;
  font: 500 13px/1.2 var(--sans); color: var(--text-dim);
  background: transparent; border: 1px solid transparent;
  border-radius: var(--radius); padding: 8px 10px; cursor: pointer;
}
.nav-btn:hover { color: var(--text); background: var(--bg-raised); }
.nav-btn.active {
  color: #eaf2ff; background: var(--accent-soft);
  border-color: var(--accent);
}
.content { padding: var(--sp-4) var(--sp-5) var(--sp-5); min-width: 0;
  max-width: 1160px; }

/* ── Views ────────────────────────────────────────────────────────────── */
.page { display: none; }
.page.active { display: block; }
.panel {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--sp-4);
  margin-bottom: var(--sp-4); min-width: 0; max-width: 100%;
}
.kv {
  display: grid; grid-template-columns:
    repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-3);
}
.kv .cell { background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius); padding: var(--sp-3); min-width: 0; }
.kv .cell .k { font-size: 11px; color: var(--text-faint);
  text-transform: uppercase; letter-spacing: .07em; margin-bottom: 4px; }
.kv .cell .v { font: 600 15px/1.3 var(--sans); color: var(--text);
  overflow-wrap: anywhere; }
.kv .cell .v.mono { font-size: 12.5px; font-weight: 500; }

/* ── Status semantics ─────────────────────────────────────────────────── */
.st { font: 600 11px/1 var(--sans); letter-spacing: .05em;
  padding: 4px 7px; border-radius: var(--radius); display: inline-block; }
.st-ok { background: var(--ok-dim); color: var(--ok); }
.st-warn { background: var(--warn-dim); color: var(--warn); }
.st-err { background: var(--err-dim); color: var(--err); }
.st-dim { background: var(--bg-raised); color: var(--text-faint);
  border: 1px solid var(--border); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block;
  margin-right: 6px; vertical-align: middle; flex: 0 0 auto; }
.dot-ok { background: var(--ok); } .dot-warn { background: var(--warn); }
.dot-err { background: var(--err); } .dot-dim { background: var(--text-faint); }

/* ── Tables ───────────────────────────────────────────────────────────── */
.data-table { width: 100%; border-collapse: collapse; margin: var(--sp-2) 0;
  font-size: 13px; }
.data-table th { text-align: left; font-size: 11px; color: var(--text-faint);
  text-transform: uppercase; letter-spacing: .06em;
  background: var(--bg-raised); padding: 8px 10px;
  border: 1px solid var(--border); white-space: nowrap; }
.data-table td { padding: 7px 10px; border: 1px solid var(--border);
  vertical-align: top; overflow-wrap: anywhere; min-width: 0; }
.data-table td.code, .data-table td .mono { font-family: var(--mono);
  font-size: 12px; }
.data-table tr.sev-high td { background: rgba(248, 113, 113, .06); }
.data-table tr.sev-medium td { background: rgba(251, 191, 36, .05); }

/* ── Timeline ─────────────────────────────────────────────────────────── */
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li {
  position: relative; padding: 0 0 var(--sp-4) var(--sp-5);
  border-left: 2px solid var(--border); margin-left: 6px;
}
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before {
  content: ""; position: absolute; left: -6px; top: 4px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--text-faint); border: 2px solid var(--bg-panel);
}
.timeline li.tl-ok::before { background: var(--ok); }
.timeline li.tl-warn::before { background: var(--warn); }
.timeline li.tl-err::before { background: var(--err); }
.timeline .tl-head { display: flex; gap: var(--sp-2); align-items: baseline;
  flex-wrap: wrap; }
.timeline .tl-stage { font-weight: 600; }
.timeline .tl-meta { color: var(--text-faint); font-size: 12px;
  font-family: var(--mono); overflow-wrap: anywhere; }

/* ── Trace tree ───────────────────────────────────────────────────────── */
.tree { list-style: none; margin: 0; padding: 0; }
.tree li {
  padding: var(--sp-2) var(--sp-3); border-left: 2px solid var(--border);
  margin: 0 0 var(--sp-2) var(--sp-3); background: var(--bg-raised);
  border-radius: 0 var(--radius) var(--radius) 0; min-width: 0;
}
.tree .span-line { display: flex; gap: var(--sp-2); align-items: baseline;
  flex-wrap: wrap; overflow-wrap: anywhere; }
.tree .span-name { font-family: var(--mono); font-size: 12.5px;
  font-weight: 600; }
.tree .span-time { color: var(--text-faint); font: 11px var(--mono); }

/* ── Skills / status lists ────────────────────────────────────────────── */
.skill-grid { display: grid; grid-template-columns:
    repeat(auto-fill, minmax(190px, 1fr)); gap: var(--sp-2); }
.skill-card {
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius); padding: var(--sp-3);
  display: flex; flex-direction: column; gap: 5px; min-width: 0;
}
.skill-card .skill-name { font-family: var(--mono); font-weight: 600;
  font-size: 12.5px; overflow-wrap: anywhere; }
.skill-card .skill-role { color: var(--text-faint); font-size: 11.5px; }

/* ── Boundaries ───────────────────────────────────────────────────────── */
.boundary-banner {
  background: var(--bg-raised); border: 1px solid var(--border-strong);
  border-left: 3px solid var(--warn); color: var(--text-dim);
  padding: var(--sp-3) var(--sp-4); border-radius: var(--radius);
  margin: var(--sp-3) 0; font-size: 12.5px; line-height: 1.6;
}
.boundary-banner strong { color: var(--warn); }
.boundary-banner code { color: var(--text); }
.boundary-banner.plain { border-left-color: var(--border-strong); }

.live-placeholder { color: var(--text-faint); font-style: italic;
  padding: var(--sp-4) 4px; }
.empty-note { color: var(--text-faint); padding: var(--sp-2) 0; }

/* ── Metrics strip (benchmark) ────────────────────────────────────────── */
.metrics { display: grid; grid-template-columns:
    repeat(auto-fit, minmax(150px, 1fr)); gap: var(--sp-2); }
.metric { background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius); padding: var(--sp-3); min-width: 0; }
.metric .m-k { font-size: 10.5px; color: var(--text-faint);
  text-transform: uppercase; letter-spacing: .07em; margin-bottom: 3px; }
.metric .m-v { font: 600 16px/1.2 var(--mono); overflow-wrap: anywhere; }

/* ── Mobile ───────────────────────────────────────────────────────────── */
@media (max-width: 880px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidenav {
    position: static; flex-direction: row; overflow-x: auto;
    border-right: 0; border-bottom: 1px solid var(--border);
    padding: var(--sp-2); gap: var(--sp-1); scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }
  .nav-btn { width: auto; white-space: nowrap; flex: 0 0 auto; }
  .content { padding: var(--sp-3); }
  .topbar { padding: var(--sp-3); }
  .topbar-status { width: 100%; }
  .kv { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">MergePilot
    <span class="mode-banner">MODE: ISOLATED_LIVE</span>
  </div>
  <div class="topbar-status">
    <div id="live-banner" class="live-banner" data-state="INIT"
         role="status" aria-live="polite">INIT · awaiting live status</div>
    <button id="live-refresh-btn" type="button">Refresh now</button>
  </div>
</header>

<div class="shell">
  <nav class="sidenav" aria-label="Views">
    <button class="nav-btn active" data-target="overview">Overview</button>
    <button class="nav-btn" data-target="timeline">Timeline</button>
    <button class="nav-btn" data-target="findings">Findings</button>
    <button class="nav-btn" data-target="rag">RAG Advisory</button>
    <button class="nav-btn" data-target="trace">Trace Tree</button>
    <button class="nav-btn" data-target="safety">Policy &amp; Safety</button>
    <button class="nav-btn" data-target="evidence">Evidence</button>
    <button class="nav-btn" data-target="benchmark">Benchmark</button>
  </nav>

  <main class="content">
    <section id="overview" class="page active">
      <div class="live-placeholder">awaiting first live snapshot…</div>
    </section>
    <section id="timeline" class="page">
      <div class="live-placeholder">awaiting first live snapshot…</div>
    </section>
    <section id="findings" class="page">
      <div class="live-placeholder">awaiting first live snapshot…</div>
    </section>
    <section id="rag" class="page">
      <div class="live-placeholder">awaiting first live snapshot…</div>
    </section>
    <section id="trace" class="page">
      <div class="live-placeholder">awaiting first live snapshot…</div>
    </section>
    <section id="safety" class="page">
      <div class="live-placeholder">awaiting first live snapshot…</div>
    </section>
    <section id="evidence" class="page">
      <div class="live-placeholder">awaiting first live snapshot…</div>
    </section>
    <section id="benchmark" class="page">
      <div class="live-placeholder">awaiting first live snapshot…</div>
    </section>
  </main>
</div>

<script src="live-refresh.js"></script>
<script>
/* View navigation (engine-agnostic; active state managed here). */
(function () {
  'use strict';
  var buttons = document.querySelectorAll('.nav-btn');
  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var target = btn.getAttribute('data-target');
      document.querySelectorAll('.page').forEach(function (p) {
        p.classList.remove('active');
      });
      buttons.forEach(function (b) { b.classList.remove('active'); });
      var page = document.getElementById(target);
      if (page) { page.classList.add('active'); }
      btn.classList.add('active');
    });
  });
})();
</script>
</body>
</html>
