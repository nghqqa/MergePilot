# Reporter runtime dependency lock (M8-GH-4B2): the checks reporter's
# GitHub App token provider needs RSA-SHA256 (RS256) JWT signing, which
# the stdlib cannot do. Exact pinned wheels for linux/amd64 CPython 3.12
# (the Dockerfile.gh-webhook base, Debian bookworm glibc >= 2.36).
# Install inside the image with:
#   pip install --only-binary=:all: --require-hashes \
#       -r /app/gh_app/requirements-reporter.lock
# cryptography 46.0.2 runtime deps on CPython 3.12: cffi>=2.0.0 (which
# pulls pycparser); typing-extensions applies only to Python < 3.11 and
