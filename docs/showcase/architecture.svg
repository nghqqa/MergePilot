<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">MergePilot isolated-live showcase architecture</title>
  <desc id="desc">Control, state, read-only console, publication, and truth-boundary layers for the deterministic MergePilot showcase.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8aa2c8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#38d9a9"/>
    </marker>
    <style>
      .title { fill:#eef4ff; font:700 27px 'Segoe UI','Microsoft YaHei',sans-serif; }
      .subtitle { fill:#90a6c8; font:14px 'Segoe UI','Microsoft YaHei',sans-serif; }
      .lane-title { fill:#66a0ff; font:600 15px 'Segoe UI','Microsoft YaHei',sans-serif; }
      .node-title { fill:#f2f6ff; font:700 17px 'Segoe UI','Microsoft YaHei',sans-serif; }
      .node-meta { fill:#66a0ff; font:12px 'Segoe UI','Microsoft YaHei',sans-serif; }
      .node-body { fill:#a9bad4; font:13px 'Segoe UI','Microsoft YaHei',sans-serif; }
      .note-title { fill:#f7c66b; font:700 15px 'Segoe UI','Microsoft YaHei',sans-serif; }
      .note { fill:#d5deec; font:13px 'Segoe UI','Microsoft YaHei',sans-serif; }
      .edge-label { fill:#90a6c8; font:12px 'Segoe UI','Microsoft YaHei',sans-serif; }
      .box { fill:#16233c; stroke:#385178; stroke-width:1.5; }
      .box-blue { fill:#16233c; stroke:#5c91f5; stroke-width:1.6; }
      .box-green { fill:#132d2a; stroke:#38d9a9; stroke-width:1.6; }
      .box-purple { fill:#241d3a; stroke:#a17cf7; stroke-width:1.6; stroke-dasharray:7 5; }
      .box-orange { fill:#2c2418; stroke:#f7b84f; stroke-width:1.6; }
      .boundary { fill:#101c31; stroke:#385178; stroke-width:1.4; stroke-dasharray:8 6; }
      .line { stroke:#8aa2c8; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .line-green { stroke:#38d9a9; stroke-width:2; fill:none; marker-end:url(#arrow-green); }
      .line-dashed { stroke:#a17cf7; stroke-width:2; fill:none; stroke-dasharray:7 5; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#0d1626"/>
  <text x="720" y="45" text-anchor="middle" class="title">MergePilot · 可审计、可验证、fail-closed 的合并治理闭环</text>
  <text x="720" y="72" text-anchor="middle" class="subtitle">ISOLATED_LIVE deterministic showcase · internal backend network · loopback-only publication</text>

  <rect id="internal-network" x="250" y="120" width="760" height="520" rx="18" class="boundary"/>
  <text x="630" y="148" text-anchor="middle" class="lane-title">INTERNAL BACKEND NETWORK · 无 host 端口 · 无外发默认路由</text>

  <g id="pr-entry">
    <rect x="40" y="205" width="180" height="110" rx="12" class="box"/>
    <text x="130" y="237" text-anchor="middle" class="node-title">PR / 开发者入口</text>
    <text x="130" y="263" text-anchor="middle" class="node-body">受保护分支与路径变更</text>
    <text x="130" y="286" text-anchor="middle" class="node-body">showcase seed 模拟输入</text>
  </g>

  <g id="policy-gateway">
    <rect x="300" y="175" width="270" height="135" rx="12" class="box-blue"/>
    <text x="435" y="207" text-anchor="middle" class="node-title">Policy Gateway</text>
    <text x="435" y="230" text-anchor="middle" class="node-meta">policy-gateway</text>
    <text x="435" y="255" text-anchor="middle" class="node-body">ALLOW / DENY / ERROR · fail-closed</text>
    <text x="435" y="278" text-anchor="middle" class="node-body">L2 approval · INSERT-only audit</text>
  </g>

  <g id="controller">
    <rect x="300" y="350" width="270" height="135" rx="12" class="box"/>
    <text x="435" y="382" text-anchor="middle" class="node-title">Controller</text>
    <text x="435" y="405" text-anchor="middle" class="node-meta">controller</text>
    <text x="435" y="430" text-anchor="middle" class="node-body">状态机 · Outbox · 幂等恢复</text>
    <text x="435" y="453" text-anchor="middle" class="node-body">MCP orchestration · drift / rollback</text>
  </g>

  <g id="postgres-state">
    <rect x="650" y="175" width="310" height="185" rx="12" class="box-green"/>
    <text x="805" y="207" text-anchor="middle" class="node-title">PostgreSQL · 审计状态库</text>
    <text x="805" y="230" text-anchor="middle" class="node-meta">postgres · pgvector · digest 固定</text>
    <text x="805" y="255" text-anchor="middle" class="node-body">task_runs · stage_runs · mcp_calls</text>
    <text x="805" y="278" text-anchor="middle" class="node-body">approvals · rollback_runs · audit_events</text>
    <text x="805" y="301" text-anchor="middle" class="node-body">revision_bindings · immutable SHA facts</text>
    <rect x="680" y="318" width="250" height="28" rx="7" fill="#0e211f" stroke="#277d65"/>
    <text x="805" y="338" text-anchor="middle" class="node-meta">mergepilot_reader · READ ONLY snapshot</text>
  </g>

  <g id="demo-console">
    <rect x="650" y="405" width="310" height="135" rx="12" class="box-blue"/>
    <text x="805" y="437" text-anchor="middle" class="node-title">Demo Console · 8 pages</text>
    <text x="805" y="460" text-anchor="middle" class="node-meta">demo-console · internal only</text>
    <text x="805" y="485" text-anchor="middle" class="node-body">shared snapshot · status + snapshot GET</text>
    <text x="805" y="508" text-anchor="middle" class="node-body">live refresh · fail-closed · read-only</text>
  </g>

  <g id="preflight">
    <rect id="preflight-box" x="300" y="560" width="660" height="58" rx="11" class="box-green" stroke-dasharray="6 4"/>
    <text x="630" y="586" text-anchor="middle" class="node-title">Preflight · one-shot startup gate</text>
    <text x="630" y="607" text-anchor="middle" class="node-body">10 contract checks · PREFLIGHT_OK before the stack is considered ready</text>
  </g>

  <g id="showcase-seed">
    <rect x="1060" y="165" width="225" height="130" rx="12" class="box-purple"/>
    <text x="1172" y="198" text-anchor="middle" class="node-title">Deterministic seed</text>
    <text x="1172" y="222" text-anchor="middle" class="node-meta">showcase-only</text>
    <text x="1172" y="247" text-anchor="middle" class="node-body">非外部客户数据</text>
    <text x="1172" y="270" text-anchor="middle" class="node-body">非生产证据 · 重放幂等</text>
  </g>

  <rect id="publication-boundary" x="1040" y="370" width="280" height="280" rx="18" class="boundary"/>
  <text x="1180" y="397" text-anchor="middle" class="lane-title">LOOPBACK PUBLICATION</text>
  <g id="console-edge">
    <rect x="1070" y="420" width="220" height="110" rx="12" class="box-orange"/>
    <text x="1180" y="451" text-anchor="middle" class="node-title">console-edge</text>
    <text x="1180" y="474" text-anchor="middle" class="node-meta">publication plumbing</text>
    <text x="1180" y="499" text-anchor="middle" class="node-body">fixed upstream · no secrets</text>
    <text x="1180" y="520" text-anchor="middle" class="node-body">GET path + Host allowlists</text>
  </g>
  <g id="browser">
    <rect x="1070" y="565" width="220" height="65" rx="12" class="box"/>
    <text x="1180" y="593" text-anchor="middle" class="node-title">Browser · demo only</text>
    <text x="1180" y="616" text-anchor="middle" class="node-body">127.0.0.1:8600 · loopback</text>
  </g>

  <g id="audit-boundary">
    <rect x="40" y="405" width="180" height="145" rx="12" class="box-green" stroke-dasharray="6 4"/>
    <text x="130" y="437" text-anchor="middle" class="node-title">Audit boundary</text>
    <text x="130" y="462" text-anchor="middle" class="node-body">INSERT-only writes</text>
    <text x="130" y="485" text-anchor="middle" class="node-body">console SELECT-only</text>
    <text x="130" y="508" text-anchor="middle" class="node-body">materials ≠ evidence</text>
    <text x="130" y="531" text-anchor="middle" class="node-body">verification frozen</text>
  </g>

  <path d="M220 260 H295" class="line"/>
  <text x="258" y="247" text-anchor="middle" class="edge-label">change request</text>
  <path d="M435 310 V345" class="line"/>
  <text x="450" y="333" class="edge-label">decision</text>
  <path d="M570 242 H645" class="line"/>
  <text x="607" y="228" text-anchor="middle" class="edge-label">audit facts</text>
  <path d="M570 417 C610 417 610 330 645 315" class="line"/>
  <text x="605" y="370" text-anchor="middle" class="edge-label">state</text>
  <path d="M805 360 V400" class="line-green"/>
  <text x="820" y="385" class="edge-label">read-only snapshot</text>
  <path d="M960 472 H1065" class="line"/>
  <text x="1012" y="458" text-anchor="middle" class="edge-label">internal upstream</text>
  <path d="M1180 530 V560" class="line"/>
  <path d="M1060 230 H965" class="line-dashed"/>
  <text x="1012" y="216" text-anchor="middle" class="edge-label">seed injection</text>
  <path d="M220 475 H645" stroke="#38d9a9" stroke-width="1.7" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow-green)"/>

  <g id="boundary-annotations">
    <rect x="40" y="690" width="1280" height="180" rx="14" class="box"/>
    <text x="65" y="720" class="note-title">Truth boundaries · 不是生产部署、云架构或多租户系统</text>
    <text x="65" y="748" class="note">1 · console-edge 是 publication plumbing，不是第五个应用服务，也不构成 application integration。</text>
    <text x="65" y="772" class="note">2 · Deterministic showcase seed 是合成数据，不是外部客户数据，不是生产证据。</text>
    <text x="65" y="796" class="note">3 · M8-A1 event ingestion machinery 不等于 revision producer integration。</text>
    <text x="65" y="820" class="note">4 · revision_producer_contract=NOT_VERIFIED · audit_producer_contract=NOT_VERIFIED。</text>
    <text x="65" y="844" class="note">5 · application_integration_verified=false · database_verified=false · production_verified=false。</text>
  </g>
</svg>
