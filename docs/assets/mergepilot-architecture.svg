<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">MergePilot 多 Agent PR 审修与风险治理系统架构</title>
  <desc id="desc">MergePilot 当前运行架构，依据提供的架构说明更新。GitHub PR 事件经公网 webhook 入口（HMAC 验签、交付台账）自动触发；gh-bridge 完成播种、唤醒与 kickoff，并按权威产物判读终态。Agent 不持有 GitHub 凭据；结论由 GitHub App（仅 Checks 读写）以 check run 回写 PR，与 CI 并排，无 merge 权限。AgentTeams 控制面管理 Worker CR、动态容器与审计汇聚，包含 Matrix、MinIO、Higress。Leader 编排，Reviewer 独立审查，Fixer 授权后修复，Verifier 独立验证；Reviewer-b 用于双审查实验。每个 Agent 通过独立 MCP 客户端按需调用工具，diff-parse、risk-classify、sast-scan、test-runner、case-retrieval 已接入，test-runner 尚未正式调用，pr-lifecycle 待受控写入通道集成。case-retrieval 已连接 PostgreSQL 与 pgvector 历史案例库，只读查询；独立 RAG 通道提供组织规范引用。人工门批准后开放修复派发，拒绝则锁定后续任务。交付补丁与独立验证报告，不自动合并。AgentLoop 与阿里云 SLS 提供模型与工具追踪、跨 Agent 属性级关联和用量计量。Workflow Controller 与任务状态数据库属于赛后集成范围，独立于当前 AgentTeams 控制面。</desc>

