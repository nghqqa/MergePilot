      <text x="1035" y="390" textLength="95" lengthAdjust="spacingAndGlyphs">03  sast-scan ✓已调用</text>
      <text x="1137" y="330" textLength="103" lengthAdjust="spacingAndGlyphs">04  test-runner 已接入(未正式调用)</text>
      <text x="1137" y="360" textLength="103" lengthAdjust="spacingAndGlyphs">05  pr-lifecycle 待接入</text>
      <text x="1137" y="390" textLength="103" lengthAdjust="spacingAndGlyphs">06  case-retrieval ✓已调用(真实结果)</text>
    </g>
    <rect x="1035" y="410" width="185" height="24" rx="12" fill="#ffffff" fill-opacity="0.16"/>
    <text x="1127" y="427" text-anchor="middle" class="tiny white">Schema · Fail-closed</text>
    <text x="1127" y="464" text-anchor="middle" class="tiny" fill="#0e7490" textLength="340" lengthAdjust="spacingAndGlyphs">SK5 轮实测：skill ×15（4种工具真实调用）· 824 span · 9轮零失败</text>
    <text x="1127" y="477" text-anchor="middle" class="tiny" fill="#0e7490">已实现 · 经 MCP 接入 Agent 实测调用</text>
    <text x="1127" y="500" text-anchor="middle" class="tiny" fill="#0e7490">与 LLM 决策分层（advisory-only）</text>

