    </g>
    <text x="1127" y="292" text-anchor="middle" class="card-title white">6 Skill DAG</text>
    <g fill="#ecfeff" font-weight="650" font-size="12px">
      <text x="1035" y="330" textLength="95" lengthAdjust="spacingAndGlyphs">01  diff-parse ✓已调用</text>
