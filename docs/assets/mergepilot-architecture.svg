    <text x="310" y="524" font-size="21" font-weight="700" class="white">AgentTeams 控制面（elemiso-ctrl）</text>
    <text x="310" y="549" class="small" fill="#dbeafe">Worker CR 调解 · 动态容器 · 审计汇聚</text>
    <text x="310" y="572" class="tiny white">Matrix (Tuwunel) · MinIO · Higress 网关</text>

