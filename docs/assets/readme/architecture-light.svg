<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="at ad">
<title id="at">MergePilot 部署拓扑：GitHub 只读接入 → 自托管单机（webhook ingress / Console / PostgreSQL / 可选 RAG sidecar）→ 可选外部 AgentTeams 执行器</title>
<desc id="ad">GitHub App 全只读接入，事件经 webhook ingress 验签去重后交给 Console；数据落在仅内网的 PostgreSQL；RAG sidecar 与 AgentTeams runtime 为可选组件；cchain 三层校验任一缺失即 BLOCKED。</desc>
<rect width="1200" height="700" rx="18" fill="#f7faf9"/>
<rect x="0.5" y="0.5" width="1199" height="699" rx="17.5" fill="none" stroke="#d8e4e0"/>
<rect x="56" y="100" width="248" height="196" rx="11" fill="#ffffff" stroke="#d3e0db" stroke-width="1.3"/><text x="74" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#131a26">GitHub · 你的仓库</text><text x="74" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#131a26">GitHub App 接入</text><text x="74" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#5b6b7c">5 项权限全只读</text><text x="74" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#5b6b7c">5 种事件自动推送</text><text x="74" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#5b6b7c">无 merge / approve 权限</text><text x="74" y="253" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#0e6b62">结果不回写 GitHub</text>
<rect x="344" y="48" width="536" height="552" rx="14" fill="#fdfffe" stroke="#b9cdc7" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="368" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#5b6b7c">你的服务器 · Docker Compose 单机</text>
