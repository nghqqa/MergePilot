<text x="0" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="45" font-weight="700" fill="#ecf5f3">PR 一提交，审查自动开始。</text>
<text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="45" font-weight="700" fill="#2ec4b6">合并权，永远在人手里。</text>
<text x="0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#8fa8a3">GitHub App 只读接入 · 多 Agent 审查给出可核查的建议</text>
<text x="0" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#8fa8a3">高危变更停下等审批 · 数据与密钥不出你的服务器</text>
