<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="ht hd">
<title id="ht">MergePilot：PR 提交后自动审查，高危变更停下等人工，合并权在人手里</title>
<desc id="hd">审查管线四步：PR 事件自动触发；多 Agent 审查输出建议；人工闸门放行或拦截；人工合并并全程审计。</desc>
<rect width="1200" height="320" rx="18" fill="#0c141d"/>
